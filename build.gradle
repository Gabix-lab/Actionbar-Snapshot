plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

def minecraftVersion = stonecutter.current.version
def yarnMappings = [
        "1.19.4": "1.19.4+build.2",
        "1.20"  : "1.20+build.1",
        "1.20.1": "1.20.1+build.10"
][minecraftVersion]
def fabricApiVersion = [
        "1.19.4": "0.87.2+1.19.4",
        "1.20"  : "0.83.0+1.20",
        "1.20.1": "0.92.12+1.20.1"
][minecraftVersion]
def satinDependency = [
        "1.19.4": "io.github.ladysnake:satin:1.12.1",
        "1.20"  : "io.github.ladysnake:satin:1.13.0",
        "1.20.1": "org.ladysnake:satin:1.14.0"
][minecraftVersion]

version = "${project.mod_version}+${minecraftVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "LadysnakeMods"
        url = "https://maven.ladysnake.org/releases"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings "net.fabricmc:yarn:${yarnMappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    modImplementation include(satinDependency)
    modImplementation "org.apiguardian:apiguardian-api:1.1.2"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraftVersion,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    archiveClassifier.set('dev')
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

remapJar {
    archiveClassifier.set('')
}

// Exposes the version-specific remapped jar to the `universal` project, which
// relocates each variant and merges them into the single universal jar.
configurations {
    universalJar {
        canBeConsumed = true
        canBeResolved = false
    }
}

artifacts {
    universalJar tasks.named('remapJar')
}

// Chiseled by `chiseledBuild`, which runs this task once per Minecraft version.
// Variant jars are staged outside build/libs so the root build output only
// contains the universal jar.
tasks.register('buildAndCollect', Copy) {
    group = 'build'
    description = 'Builds this version and stages its remapped jar for debugging.'
    dependsOn tasks.named('build')
    from tasks.named('remapJar').flatMap { it.archiveFile }
    into rootProject.layout.buildDirectory.dir('variants')
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
        maven {
            name = "LadysnakeMods"
            url = "https://maven.ladysnake.org/releases"
        }
    }
}