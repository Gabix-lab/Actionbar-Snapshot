plugins {
    id "dev.kikugie.stonecutter"
}

stonecutter.active "1.19.4" /* [SC] DO NOT EDIT */

stonecutter.registerChiseled tasks.register("chiseledBuild", stonecutter.chiseled) { 
    setGroup "project"
    ofTask "buildAndCollect"
}

// Builds every version variant and merges them into the single universal jar.
// The task must be invoked by this exact name, because Stonecutter only enables
// its chiseled source processing when a registered chiseled task name is present
// in the command-line task list.
stonecutter.registerChiseled tasks.register("universalBuild", stonecutter.chiseled) {
    setGroup "build"
    description "Builds the single MVP jar for Minecraft 1.19.4, 1.20 and 1.20.1."
    ofTask "remapJar"
    finalizedBy ":universal:universalJar"
}

// `build` is what IDEs and `gradlew build` invoke. Alias it to the same
// chiseled pipeline so a normal Build action produces the universal jar
// instead of trying to assemble three incomplete standalone variants.
stonecutter.registerChiseled tasks.register("build", stonecutter.chiseled) {
    setGroup "build"
    description "Builds the single MVP jar for Minecraft 1.19.4, 1.20 and 1.20.1."
    ofTask "remapJar"
    finalizedBy ":universal:universalJar"
}
